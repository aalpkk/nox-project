services:
  - type: web
    name: nox-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m agent.bot --webhook ${RENDER_EXTERNAL_URL}
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: GH_PAGES_BASE_URL
        value: "https://aalpkk.github.io/nox-signals"
      # Portfolio advisor (PR #72): /portfoy /poz_al /poz_sat /nakit /danis için
      - key: NOX_PORTFOLIO_REPO
        value: "aalpkk/nox-private"
      - key: GH_TOKEN          # PAT (repo scope) — değer dashboard'dan girilir
        sync: false

  # extfeed MCP connector — claude.ai "custom connector" icin canli veri servisi
  # Kurulum: Render dashboard'da INTRADAY_SID / INTRADAY_SIGN / MCP_TOKEN gir;
  # claude.ai > Settings > Connectors > Add custom connector:
  #   https://nox-extfeed-mcp.onrender.com/<MCP_TOKEN>/mcp
  - type: web
    name: nox-extfeed-mcp
    runtime: python
    plan: free
    buildCommand: pip install "pandas>=2.1,<3.0" numpy requests "yfinance>=0.2.31" "websockets>=12" pyyaml "mcp==2.0.0" uvicorn
    startCommand: python tools/extfeed_mcp_server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INTRADAY_SID
        sync: false
      - key: INTRADAY_SIGN
        sync: false
      - key: MCP_TOKEN
        sync: false
