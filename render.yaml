services:
  - type: web
    name: nox-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m agent.bot --webhook ${RENDER_EXTERNAL_URL}
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: GH_PAGES_BASE_URL
        value: "https://aalpkk.github.io/nox-signals"
      # Portfolio advisor (PR #72): /portfoy /poz_al /poz_sat /nakit /danis için
      - key: NOX_PORTFOLIO_REPO
        value: "aalpkk/nox-private"
      - key: GH_TOKEN          # PAT (repo scope) — değer dashboard'dan girilir
        sync: false
