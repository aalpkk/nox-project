name: decision engine v1

# PR-DE-3 — Decision Engine v1 close-mode chain.
#
# Composes the DE v1 chain (Stages 1–9) on top of a pre-existing
# successful master-data-pull run. NEVER pulls master data inline.
#
# Triggers (PR-DE-3.19):
#   workflow_dispatch         → manual run; run_mode and target_date selectable.
#   workflow_run (auto)       → fires when `master data pull` completes
#                               successfully on main. The `gate` job filters
#                               to close-mode firings only (master-data-pull
#                               close cron = 16:00 UTC = 19:00 TR weekdays).
#                               Intraday cron firings (14:10/14:20/14:30/15:30
#                               UTC) are filtered out. run_mode defaults to `close`
#                               and target_date defaults to Europe/Istanbul
#                               today via the resolver step.
#
# Inputs (workflow_dispatch only):
#   run_mode = close          → full chain after master-data close
#   run_mode = intraday_manual → scaffold-only; emits
#                                STOP_INTRADAY_UNSUPPORTED advisory
#                                and fails the job until validated.
#
# Data-condition FAIL (e.g. HB on asof has zero trigger/retest_bounce
# → Stage 6 signal_asof_floor → Stage 8 source_asof_mismatch) is NOT a
# bug; the workflow emits a NO_DE_DAY advisory artifact and concludes
# success. Bug-FAIL (any other stage failure) hard-fails the job.

concurrency:
  group: decision-engine-v1-${{ github.ref }}-${{ github.event.inputs.run_mode || 'close' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: close (full chain after master-data close) | intraday_manual (scaffold; STOP_INTRADAY_UNSUPPORTED until validated)'
        required: true
        type: choice
        options:
          - close
          - intraday_manual
        default: close
      target_date:
        description: 'Operational target date (YYYY-MM-DD). Leave blank for Europe/Istanbul today.'
        required: false
        default: ''
  workflow_run:
    workflows: ["master data pull"]
    types: [completed]
    branches: [main]

jobs:
  gate:
    # PR-DE-3.19: filter workflow_run firings to close-mode only and let
    # workflow_dispatch through unconditionally. Skips intraday cron firings
    # of master-data-pull (14:10/14:20/14:30 UTC) and any failed upstream.
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Evaluate trigger eligibility
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_STARTED: ${{ github.event.workflow_run.run_started_at }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "[de-v1 gate] manual workflow_dispatch — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # workflow_run path. We have already filtered to branch=main via
          # the `on.workflow_run.branches` trigger config; double-check here.
          if [ "$UPSTREAM_BRANCH" != "main" ]; then
            echo "[de-v1 gate] SKIP: upstream branch=$UPSTREAM_BRANCH (expected main)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "[de-v1 gate] SKIP: upstream conclusion=$UPSTREAM_CONCLUSION (expected success)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # master-data-pull cron UTC schedule:
          #   14:10/14:20/14:30  → intraday_1700 (skip DE)
          #   15:30              → intraday_1700 (skip DE — günlük tarama close'u)
          #   16:00              → close         (proceed)
          # workflow_dispatch firings on master-data-pull may happen at any
          # hour; we proceed iff the run started at 16:00 UTC or later
          # (close window). This is a wide tolerance for cron skew.
          HOUR="${UPSTREAM_STARTED:11:2}"
          echo "[de-v1 gate] upstream: event=$UPSTREAM_EVENT conclusion=$UPSTREAM_CONCLUSION started_at=$UPSTREAM_STARTED hour_utc=$HOUR"
          if [ -z "$HOUR" ]; then
            echo "[de-v1 gate] SKIP: could not parse hour from started_at='$UPSTREAM_STARTED'"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HOUR" -ge 16 ]; then
            echo "[de-v1 gate] PROCEED: upstream is close-mode (hour=$HOUR UTC ≥ 16)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[de-v1 gate] SKIP: upstream is intraday cron (hour=$HOUR UTC < 16); DE only chains close cron"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  decision-engine-v1:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # rotate-on-HALT auto-commits the rotated baseline to main
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve inputs (mode, asof)
        id: resolve
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.run_mode }}'
          if [ -z "$MODE" ]; then
            MODE=close
          fi
          ASOF='${{ github.event.inputs.target_date }}'
          if [ -z "$ASOF" ]; then
            ASOF=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          fi
          # ISO-date format guard
          if ! echo "$ASOF" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::target_date must be YYYY-MM-DD, got '$ASOF'"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "asof=$ASOF" >> "$GITHUB_OUTPUT"
          echo "[de-v1] resolved mode=$MODE asof=$ASOF"

      - name: Guard intraday_manual (scaffold-only in v0)
        if: steps.resolve.outputs.mode == 'intraday_manual'
        run: |
          set -euo pipefail
          ASOF='${{ steps.resolve.outputs.asof }}'
          mkdir -p output
          cat > "output/decision_engine_v1_intraday_unsupported_${ASOF}.json" <<EOF
          {
            "verdict": "STOP_INTRADAY_UNSUPPORTED",
            "reason": "intraday_manual mode is scaffolded but not validated in PR-DE-3 v0. Use run_mode=close after master-data-pull close-mode artifacts are available.",
            "mode": "intraday_manual",
            "asof": "${ASOF}",
            "provisional": true,
            "run_id": "${{ github.run_id }}"
          }
          EOF
          echo "[de-v1] STOP_INTRADAY_UNSUPPORTED — mode=intraday_manual not yet validated; failing job"
          exit 1

      - name: Verify baseline-lock archives present + sha256 match
        run: |
          set -euo pipefail
          PARQUET_PATH=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_hb_archive']['path'])")
          PARQUET_SHA=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_hb_archive']['sha256'])")
          META_PATH=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['research_frozen_metadata_archive']['path'])")
          if [ ! -f "$PARQUET_PATH" ]; then
            echo "::error::baseline-lock parquet missing: $PARQUET_PATH"
            exit 1
          fi
          if [ ! -f "$META_PATH" ]; then
            echo "::error::baseline-lock metadata missing: $META_PATH"
            exit 1
          fi
          ACTUAL_SHA=$(sha256sum "$PARQUET_PATH" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$PARQUET_SHA" ]; then
            echo "::error::baseline-lock parquet sha256 mismatch: actual=$ACTUAL_SHA pinned=$PARQUET_SHA"
            exit 1
          fi
          echo "[de-v1] baseline-lock archives verified:"
          echo "  $PARQUET_PATH  sha256=$ACTUAL_SHA OK"
          echo "  $META_PATH  present OK"

      - name: Select master-data-pull source run
        id: select_md
        run: |
          set -euo pipefail
          ASOF='${{ steps.resolve.outputs.asof }}'
          MODE='${{ steps.resolve.outputs.mode }}'
          mkdir -p /tmp/md_check
          SELECTED=""
          for RUN_ID in $(gh run list --workflow=master-data-pull.yml --status=success --limit=30 --json databaseId --jq '.[].databaseId'); do
            rm -rf /tmp/md_check/*
            if ! gh run download "$RUN_ID" -n master-data-manifest -D /tmp/md_check 2>/dev/null; then
              continue
            fi
            if [ ! -f /tmp/md_check/master_data_manifest.json ]; then
              continue
            fi
            M_MODE=$(jq -r '.mode // empty' /tmp/md_check/master_data_manifest.json)
            M_DATE=$(jq -r '.operational_target_date // empty' /tmp/md_check/master_data_manifest.json)
            M_VERDICT=$(jq -r '.verdict // empty' /tmp/md_check/master_data_manifest.json)
            M_FRESH=$(jq -r '.freshness_status // empty' /tmp/md_check/master_data_manifest.json)
            echo "  candidate run_id=$RUN_ID mode=$M_MODE asof=$M_DATE verdict=$M_VERDICT freshness=$M_FRESH"
            if [ "$M_MODE" = "$MODE" ] && [ "$M_DATE" = "$ASOF" ] && [ "$M_VERDICT" = "PASS" ] && [ "$M_FRESH" = "PASS" ]; then
              SELECTED="$RUN_ID"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "::error::no matching master-data-pull run for mode=$MODE asof=$ASOF (verdict=PASS freshness=PASS) in last 30 successful runs"
            exit 1
          fi
          echo "run_id=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "[de-v1] selected master-data-pull run: $SELECTED"

      - name: Download master-data artifacts
        run: |
          set -euo pipefail
          RUN_ID='${{ steps.select_md.outputs.run_id }}'
          MODE='${{ steps.resolve.outputs.mode }}'
          mkdir -p output
          rm -f \
            output/master_data_manifest.json \
            output/extfeed_intraday_1h_3y_master.parquet \
            output/ohlcv_10y_fintables_master.parquet \
            output/xu100_extfeed_daily.parquet
          gh run download "$RUN_ID" -n master-data-manifest -D output
          gh run download "$RUN_ID" -n master-extfeed-intraday-1h -D output
          if [ "$MODE" = "close" ]; then
            gh run download "$RUN_ID" -n master-ohlcv-fintables -D output
            gh run download "$RUN_ID" -n master-xu100-extfeed-daily -D output
          fi
          echo "[de-v1] downloaded master-data artifacts from run $RUN_ID"
          ls -la output/master_data_manifest.json output/extfeed_intraday_1h_3y_master.parquet 2>&1 || true
          if [ "$MODE" = "close" ]; then
            ls -la output/ohlcv_10y_fintables_master.parquet output/xu100_extfeed_daily.parquet 2>&1 || true
          fi

      - name: Validate master-data manifest consistency
        run: |
          set -euo pipefail
          ASOF='${{ steps.resolve.outputs.asof }}'
          MODE='${{ steps.resolve.outputs.mode }}'
          M_MODE=$(jq -r '.mode // empty' output/master_data_manifest.json)
          M_DATE=$(jq -r '.operational_target_date // empty' output/master_data_manifest.json)
          M_VERDICT=$(jq -r '.verdict // empty' output/master_data_manifest.json)
          M_FRESH=$(jq -r '.freshness_status // empty' output/master_data_manifest.json)
          fail=0
          [ "$M_MODE" = "$MODE" ]   || { echo "::error::manifest.mode=$M_MODE != $MODE"; fail=1; }
          [ "$M_DATE" = "$ASOF" ]   || { echo "::error::manifest.operational_target_date=$M_DATE != $ASOF"; fail=1; }
          [ "$M_VERDICT" = "PASS" ] || { echo "::error::manifest.verdict=$M_VERDICT != PASS"; fail=1; }
          [ "$M_FRESH" = "PASS" ]   || { echo "::error::manifest.freshness_status=$M_FRESH != PASS"; fail=1; }
          [ -f output/extfeed_intraday_1h_3y_master.parquet ] || { echo "::error::extfeed parquet missing"; fail=1; }
          if [ "$MODE" = "close" ]; then
            [ -f output/ohlcv_10y_fintables_master.parquet ] || { echo "::error::fintables parquet missing"; fail=1; }
            [ -f output/xu100_extfeed_daily.parquet ]         || { echo "::error::xu100 parquet missing"; fail=1; }
          fi
          [ $fail -eq 0 ] || exit 1
          echo "[de-v1] manifest consistency PASS"

      - name: Producer — RDP regime labels (Stage 3 dep)
        run: |
          set -euo pipefail
          ASOF='${{ steps.resolve.outputs.asof }}'
          python tools/build_rdp_regime_labels.py
          if [ ! -f output/regime_labels_daily_rdp_v1.csv ]; then
            echo "::error::regime_labels_daily_rdp_v1.csv missing after producer step"
            exit 1
          fi
          MAX_DATE=$(python -c "import pandas as pd;print(pd.read_csv('output/regime_labels_daily_rdp_v1.csv')['date'].max())")
          echo "[de-v1] regime_labels_daily_rdp_v1.csv max_date=$MAX_DATE vs lctd=$ASOF"
          if [[ "$MAX_DATE" < "$ASOF" ]]; then
            echo "::error::regime_labels_daily_rdp_v1 stale: max_date=$MAX_DATE < lctd=$ASOF"
            exit 1
          fi
          echo "[de-v1] RDP regime labels freshness PASS"

      - name: Stage 1 — mb_scanner_events_run
        run: python tools/mb_scanner_events_run.py

      - name: Stage 2 — scanner_v1_event_quality
        run: python tools/scanner_v1_event_quality.py

      - name: Seed operational HB from baseline-lock (Stage 3 archive dep)
        run: |
          set -euo pipefail
          OP_HB="output/horizontal_base_event_v1.parquet"
          if [ -f "$OP_HB" ]; then
            echo "[de-v1] operational HB already present; skipping seed"
            exit 0
          fi
          LOCKED_PATH=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_hb_archive']['path'])" || true)
          LOCKED_SHA=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_hb_archive']['sha256'])" || true)
          if [ -z "$LOCKED_PATH" ] || [ -z "$LOCKED_SHA" ]; then
            echo "::error::pin_baselines.toml [locked_hb_archive] path/sha256 unresolved"
            exit 1
          fi
          if [ ! -f "$LOCKED_PATH" ]; then
            echo "::error::baseline-lock HB source missing: $LOCKED_PATH"
            exit 1
          fi
          ACTUAL_SHA=$(sha256sum "$LOCKED_PATH" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$LOCKED_SHA" ]; then
            echo "::error::baseline-lock HB sha256 mismatch: actual=$ACTUAL_SHA pinned=$LOCKED_SHA"
            exit 1
          fi
          cp "$LOCKED_PATH" "$OP_HB"
          if [ ! -f "$OP_HB" ]; then
            echo "::error::operational HB missing after seed copy"
            exit 1
          fi
          echo "[de-v1] seeded operational HB from baseline-lock: $LOCKED_PATH -> $OP_HB (sha256=$ACTUAL_SHA)"

      - name: Stage 3 — decision_engine_v1_upstream_scanner_refresh
        run: python tools/decision_engine_v1_upstream_scanner_refresh.py --lctd-required ${{ steps.resolve.outputs.asof }}

      - name: Stage 4 — ema_context_run
        run: python tools/ema_context_run.py

      - name: Seed locked EMA pilot panels from baseline-lock (Stage 5 archive dep)
        run: |
          set -euo pipefail
          for N in 3 5 6 7; do
            OP_PANEL="output/ema_context_pilot${N}_panel.parquet"
            if [ -f "$OP_PANEL" ]; then
              echo "[de-v1] locked pilot${N} panel already present; skipping seed"
              continue
            fi
            LOCKED_PATH=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_pilot${N}_panel']['path'])" || true)
            LOCKED_SHA=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_pilot${N}_panel']['sha256'])" || true)
            if [ -z "$LOCKED_PATH" ] || [ -z "$LOCKED_SHA" ]; then
              echo "::error::pin_baselines.toml [locked_pilot${N}_panel] path/sha256 unresolved"
              exit 1
            fi
            if [ ! -f "$LOCKED_PATH" ]; then
              echo "::error::baseline-lock pilot${N} source missing: $LOCKED_PATH"
              exit 1
            fi
            ACTUAL_SHA=$(sha256sum "$LOCKED_PATH" | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$LOCKED_SHA" ]; then
              echo "::error::baseline-lock pilot${N} sha256 mismatch: actual=$ACTUAL_SHA pinned=$LOCKED_SHA"
              exit 1
            fi
            cp "$LOCKED_PATH" "$OP_PANEL"
            if [ ! -f "$OP_PANEL" ]; then
              echo "::error::operational pilot${N} panel missing after seed copy"
              exit 1
            fi
            echo "[de-v1] seeded locked pilot${N} panel: $LOCKED_PATH -> $OP_PANEL (sha256=$ACTUAL_SHA)"
          done

      - name: Stage 5 — decision_engine_v1_ema_forward_alignment (rotate-on-HALT)
        env:
          ASOF: ${{ steps.resolve.outputs.asof }}
        run: |
          set -uo pipefail
          MF=output/decision_v1_ema_forward_alignment_manifest.json
          run_stage5() { python tools/decision_engine_v1_ema_forward_alignment.py --lctd-required "$ASOF"; }

          if run_stage5; then
            echo "[de-v1] Stage 5 PASS (baseline current, no rotation)"
            exit 0
          fi

          # Stage 5 failed. Distinguish a benign staleness HALT (the frozen baseline
          # has drifted past the §6.4 sub-ceiling) from a real bug. The pilot3_forward
          # RuntimeError is captured in the manifest's step stderr_tail.
          STALE=$(python -c "import json; s=json.dumps(json.load(open('$MF'))); print('yes' if ('emission_diff_exceeds_subceiling' in s or 'forward_delta_exceeds' in s) else 'no')" 2>/dev/null || echo no)
          if [ "$STALE" != "yes" ]; then
            echo "::error::Stage 5 hard FAIL — not a staleness HALT (inspect $MF). No auto-rotation."
            exit 1
          fi

          echo "[de-v1] Stage 5 staleness HALT → auto-rotating frozen baseline to current CI HB"
          python tools/de_v1_rotate_baseline.py

          # Commit the rotated baseline (pin + new archives) back to main so every
          # downstream + future run uses it. CI-native HB ⇒ no local-vs-CI lineage gap.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t CHANGED < output/_de_rotate_changed.txt
          git add -- "${CHANGED[@]}"
          if git diff --cached --quiet; then
            echo "::error::rotation produced no staged changes — unexpected"; exit 1
          fi
          git commit -m "chore(de-v1): auto-rotate baseline (rotate-on-HALT) asof=$ASOF [skip ci]"
          # Persist to main, BEST-EFFORT. The checkout is shallow (fetch-depth: 1;
          # the .git history is multi-GB so a full clone per run is not viable), so
          # we must NOT rebase (no merge-base under shallow). A single fast-forward
          # push of one commit whose parent IS the remote tip works fine on a shallow
          # clone — the server enforces FF. If main advanced during this run the push
          # is rejected; that is non-fatal: THIS run already rotated locally (Stages
          # 6-9 below use it) and the next run will simply re-rotate and retry the push.
          if git push origin HEAD:main; then
            echo "[de-v1] rotated baseline persisted to main"
          else
            echo "::warning::could not fast-forward the rotated baseline to main (main advanced or shallow); this run is unaffected — it uses the local rotation; the next run re-rotates + retries the push"
          fi

          echo "[de-v1] retrying Stage 5 with rotated baseline"
          if run_stage5; then
            echo "[de-v1] Stage 5 PASS after auto-rotation"
          else
            echo "::error::Stage 5 STILL fails after rotation — aborting for manual review"; exit 1
          fi

      - name: Seed locked pilot7 research CSVs from baseline-lock (Stage 6 archive dep)
        run: |
          set -euo pipefail
          for KEY in pilot7_gates_main pilot7_drop_diagnostic_census; do
            OP_CSV="output/ema_context_${KEY}.csv"
            if [ -f "$OP_CSV" ]; then
              echo "[de-v1] locked ${KEY} already present; skipping seed"
              continue
            fi
            LOCKED_PATH=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_${KEY}']['path'])" || true)
            LOCKED_SHA=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_${KEY}']['sha256'])" || true)
            if [ -z "$LOCKED_PATH" ] || [ -z "$LOCKED_SHA" ]; then
              echo "::error::pin_baselines.toml [locked_${KEY}] path/sha256 unresolved"
              exit 1
            fi
            if [ ! -f "$LOCKED_PATH" ]; then
              echo "::error::baseline-lock ${KEY} source missing: $LOCKED_PATH"
              exit 1
            fi
            ACTUAL_SHA=$(sha256sum "$LOCKED_PATH" | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$LOCKED_SHA" ]; then
              echo "::error::baseline-lock ${KEY} sha256 mismatch: actual=$ACTUAL_SHA pinned=$LOCKED_SHA"
              exit 1
            fi
            cp "$LOCKED_PATH" "$OP_CSV"
            if [ ! -f "$OP_CSV" ]; then
              echo "::error::operational ${KEY} missing after seed copy"
              exit 1
            fi
            echo "[de-v1] seeded locked ${KEY}: $LOCKED_PATH -> $OP_CSV (sha256=$ACTUAL_SHA)"
          done

      - name: Stage 6 — paper_execution_v0_forward_run (may FAIL on data condition)
        id: stage6
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/paper_execution_v0_forward_run.py --lctd-required ${{ steps.resolve.outputs.asof }} 2>&1 | tee /tmp/stage6.log
          exit ${PIPESTATUS[0]}

      - name: Stage 6 verdict check
        id: stage6_verdict
        run: |
          set -euo pipefail
          # PR-DE-3.15: 4-state Stage-6 routing.
          #   PASS             → continue, normal
          #   PASS_DEGRADED    → continue, exclude stale paper_origin(s) downstream
          #   FAIL_NO_DE_DAY   → data-condition: NO_DE_DAY advisory, skip Stage 8/9
          #   FAIL_HARD / else → bug FAIL: workflow fails
          OUTCOME='${{ steps.stage6.outcome }}'
          STATE="PASS"
          EXCLUDE=""
          DATA_CONDITION="false"
          REASON=""
          MANIFEST="output/paper_execution_v0_forward_run_manifest.json"
          if [ -f "$MANIFEST" ]; then
            STATE=$(jq -r '.verdict_extended // empty' "$MANIFEST")
            REASON=$(jq -r '.failure_reason // .reason // .fail_reason // .fail_reasons[0] // empty' "$MANIFEST")
            EXCLUDE=$(jq -r '.excluded_paper_origins // [] | join(",")' "$MANIFEST")
          fi
          if [ -z "$STATE" ] && [ -f /tmp/stage6.log ]; then
            # Legacy fallback (pre-PR-DE-3.15 manifest schema): infer from log.
            REASON_FROM_LOG=$(grep -oE '(signal_asof_floor[^"]*|no_tr_signals_today[^"]*|source_asof_mismatch[^"]*)' /tmp/stage6.log | head -1 || true)
            if [ -z "$REASON" ]; then REASON="$REASON_FROM_LOG"; fi
          fi
          case "$OUTCOME" in
            success)
              # Stage 6 exited 0 — must be PASS or PASS_DEGRADED.
              if [ "$STATE" = "PASS_DEGRADED" ]; then
                echo "[de-v1] Stage 6 PASS_DEGRADED: excluded paper_origins=$EXCLUDE; reason=$REASON"
              else
                STATE="PASS"
                echo "[de-v1] Stage 6 PASS"
              fi
              ;;
            failure)
              if [ "$STATE" = "FAIL_NO_DE_DAY" ]; then
                DATA_CONDITION="true"
                echo "[de-v1] Stage 6 FAIL_NO_DE_DAY: both paper lines stale; reason=$REASON"
              elif [ -z "$STATE" ] && echo "$REASON" | grep -qiE '(signal_asof_floor|no_tr_signals_today)'; then
                # Legacy classifier: pre-PR-DE-3.15 manifest → terminal NO_DE_DAY
                DATA_CONDITION="true"
                STATE="FAIL_NO_DE_DAY"
                echo "[de-v1] Stage 6 legacy data-condition (no verdict_extended): $REASON"
              else
                echo "::error::Stage 6 hard FAIL (bug): state=${STATE:-<unset>} reason=${REASON:-<unknown>}"
                if [ -f /tmp/stage6.log ]; then
                  echo "--- tail of stage6.log ---" >&2
                  tail -80 /tmp/stage6.log >&2 || true
                fi
                exit 1
              fi
              ;;
            *)
              echo "::error::Stage 6 unexpected outcome=$OUTCOME state=$STATE reason=$REASON"
              exit 1
              ;;
          esac
          # Sanity: PASS/PASS_DEGRADED must imply data_condition=false.
          # PASS_DEGRADED must have a non-empty exclude_sources; PASS must not.
          if [ "$STATE" = "PASS_DEGRADED" ] && [ -z "$EXCLUDE" ]; then
            echo "::error::Stage 6 PASS_DEGRADED but excluded_paper_origins is empty — contract violation"
            exit 1
          fi
          if [ "$STATE" = "PASS" ] && [ -n "$EXCLUDE" ]; then
            echo "::error::Stage 6 PASS but excluded_paper_origins=$EXCLUDE is non-empty — contract violation"
            exit 1
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "exclude_sources=$EXCLUDE" >> "$GITHUB_OUTPUT"
          echo "data_condition=$DATA_CONDITION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Seed prior-day DE operational state from baseline-lock (Stage 7 archive dep)
        run: |
          set -euo pipefail
          declare -A SEED_MAP=(
            [de_v1_events]="output/decision_engine_v1_events.parquet"
            [de_v1_tier2_label_distribution]="output/decision_engine_v1_tier2_label_distribution.csv"
            [de_v1_paper_link_integrity]="output/decision_engine_v1_paper_link_integrity.csv"
            [de_v1_tier2_label_summary]="output/decision_engine_v1_tier2_label_table_summary.md"
            [de_v1_tier3_review_report]="output/decision_engine_v1_tier3_review_report.md"
            [de_v0_classification_panel]="output/decision_v0_classification_panel.parquet"
          )
          for KEY in "${!SEED_MAP[@]}"; do
            OP_PATH="${SEED_MAP[$KEY]}"
            if [ -f "$OP_PATH" ]; then
              echo "[de-v1] locked ${KEY} already present at ${OP_PATH}; skipping seed"
              continue
            fi
            LOCKED_PATH=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_${KEY}']['path'])" || true)
            LOCKED_SHA=$(python -c "import tomllib;d=tomllib.load(open('tools/pin_baselines.toml','rb'));print(d['locked_${KEY}']['sha256'])" || true)
            if [ -z "$LOCKED_PATH" ] || [ -z "$LOCKED_SHA" ]; then
              echo "::error::pin_baselines.toml [locked_${KEY}] path/sha256 unresolved"
              exit 1
            fi
            if [ ! -f "$LOCKED_PATH" ]; then
              echo "::error::baseline-lock ${KEY} source missing: $LOCKED_PATH"
              exit 1
            fi
            ACTUAL_SHA=$(sha256sum "$LOCKED_PATH" | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$LOCKED_SHA" ]; then
              echo "::error::baseline-lock ${KEY} sha256 mismatch: actual=$ACTUAL_SHA pinned=$LOCKED_SHA"
              exit 1
            fi
            cp "$LOCKED_PATH" "$OP_PATH"
            if [ ! -f "$OP_PATH" ]; then
              echo "::error::operational ${KEY} missing after seed copy: $OP_PATH"
              exit 1
            fi
            echo "[de-v1] seeded locked ${KEY}: $LOCKED_PATH -> $OP_PATH (sha256=$ACTUAL_SHA)"
          done

      - name: Stage 7 — decision_engine_v1_panel_refresh
        run: python tools/decision_engine_v1_panel_refresh.py --lctd-required ${{ steps.resolve.outputs.asof }}

      # Stage 7.5 (PR-DE-3.16): refresh Trident structural probe from
      # mb_scanner_events_*.parquet + extfeed master. Produces
      # `output/trident_probe_mb_3y.parquet` consumed by Stage 9 watchlist
      # generator's structural enrichment join. continue-on-error: true so a
      # probe failure does not block watchlist emission — Stage 9 silently
      # degrades to zero attachments when the parquet is missing/empty.
      - name: Stage 7.5 — trident_probe_mb_3y (structural refresh)
        continue-on-error: true
        run: python tools/trident_probe_mb_3y.py 2>&1 | tee /tmp/stage7_5.log

      - name: Stage 8 — decision_engine_v1_run (Tier 2)
        if: steps.stage6_verdict.outputs.data_condition == 'false'
        id: stage8
        continue-on-error: true
        env:
          STAGE6_EXCLUDE: ${{ steps.stage6_verdict.outputs.exclude_sources }}
        run: |
          set -o pipefail
          if [ -n "$STAGE6_EXCLUDE" ]; then
            echo "[de-v1] Stage 8 degraded mode: --exclude-sources=$STAGE6_EXCLUDE"
            python tools/decision_engine_v1_run.py --tier 2 \
              --asof-date ${{ steps.resolve.outputs.asof }} \
              --exclude-sources "$STAGE6_EXCLUDE" 2>&1 | tee /tmp/stage8.log
          else
            python tools/decision_engine_v1_run.py --tier 2 \
              --asof-date ${{ steps.resolve.outputs.asof }} 2>&1 | tee /tmp/stage8.log
          fi
          exit ${PIPESTATUS[0]}

      - name: Stage 8 verdict check
        if: steps.stage6_verdict.outputs.data_condition == 'false'
        id: stage8_verdict
        run: |
          set -euo pipefail
          OUTCOME='${{ steps.stage8.outcome }}'
          DATA_CONDITION="false"
          REASON=""
          if [ "$OUTCOME" = "failure" ]; then
            if [ -f /tmp/stage8.log ]; then
              REASON=$(grep -oE '(source_asof_mismatch[^"]*|no_tr_signals_today[^"]*|signal_asof_floor[^"]*|no_events_post_exclusion[^"]*)' /tmp/stage8.log | head -1 || true)
            fi
            # PR-DE-3.15: `no_events_post_exclusion` is a data-condition
            # (post-exclusion event set was empty). Treated like NO_DE_DAY.
            if echo "$REASON" | grep -qiE '(source_asof_mismatch|no_tr_signals_today|no_events_post_exclusion)'; then
              DATA_CONDITION="true"
              echo "[de-v1] Stage 8 data-condition FAIL: $REASON"
            else
              echo "::error::Stage 8 hard FAIL (bug): reason=${REASON:-<unknown>}"
              if [ -f /tmp/stage8.log ]; then
                echo "--- tail of stage8.log ---" >&2
                tail -80 /tmp/stage8.log >&2 || true
              fi
              exit 1
            fi
          fi
          echo "data_condition=$DATA_CONDITION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Stage 9 — decision_engine_v1_watchlist_generator
        if: ${{ steps.stage6_verdict.outputs.data_condition == 'false' && steps.stage8_verdict.outputs.data_condition == 'false' }}
        run: python tools/decision_engine_v1_watchlist_generator.py --asof-date ${{ steps.resolve.outputs.asof }}

      - name: Build NO_DE_DAY advisory manifest
        if: ${{ steps.stage6_verdict.outputs.data_condition == 'true' || steps.stage8_verdict.outputs.data_condition == 'true' }}
        run: |
          set -euo pipefail
          ASOF='${{ steps.resolve.outputs.asof }}'
          MODE='${{ steps.resolve.outputs.mode }}'
          R6='${{ steps.stage6_verdict.outputs.reason }}'
          R8='${{ steps.stage8_verdict.outputs.reason }}'
          STATE6='${{ steps.stage6_verdict.outputs.state }}'
          CAUSE=""
          if [ "${{ steps.stage6_verdict.outputs.data_condition }}" = "true" ]; then
            CAUSE="stage6:${R6}"
          fi
          if [ "${{ steps.stage8_verdict.outputs.data_condition }}" = "true" ]; then
            if [ -n "$CAUSE" ]; then CAUSE="${CAUSE};stage8:${R8}"; else CAUSE="stage8:${R8}"; fi
          fi
          # PR-DE-3.15: NO_DE_DAY only happens when (a) BOTH paper lines stale
          # at Stage 6 (FAIL_NO_DE_DAY), or (b) Stage 8 post-exclusion event
          # set is empty (`no_events_post_exclusion`), or (c) legacy fallback
          # (pre-3.15 manifest single-line stale). Partial staleness now flows
          # through Stage 8 in degraded mode and emits a watchlist instead.
          python - <<PY
          import json, os
          payload = {
              "verdict": "NO_DE_DAY",
              "mode": os.environ["MODE"],
              "asof": os.environ["ASOF"],
              "cause": os.environ["CAUSE"],
              "stage6_state": os.environ.get("STATE6", ""),
              "reason_human": (
                  "Data-condition FAIL. Either both paper lines are stale at "
                  "Stage 6 (FAIL_NO_DE_DAY) or Stage 8 produced zero events "
                  "after applying the degraded-contract exclusion "
                  "(no_events_post_exclusion). This is NOT a bug — the "
                  "workflow concludes success with this advisory."
              ),
              "no_final_watchlist": True,
              "live_gate": "CLOSED",
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_ref": os.environ.get("GITHUB_REF", ""),
          }
          out = f"output/decision_engine_v1_no_de_day_advisory_{payload['asof']}.json"
          with open(out, "w") as f:
              json.dump(payload, f, indent=2)
          print(f"[de-v1] NO_DE_DAY advisory written: {out}")
          PY
        env:
          ASOF: ${{ steps.resolve.outputs.asof }}
          MODE: ${{ steps.resolve.outputs.mode }}
          STATE6: ${{ steps.stage6_verdict.outputs.state }}
          CAUSE: ''

      - name: Upload manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-v1-manifests-${{ steps.resolve.outputs.asof }}
          path: |
            output/master_data_manifest.json
            output/decision_v1_upstream_scanner_refresh_manifest.json
            output/decision_v1_ema_forward_alignment_manifest.json
            output/paper_execution_v0_forward_run_manifest.json
            output/decision_v1_panel_refresh_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload events parquet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-v1-events-${{ steps.resolve.outputs.asof }}
          path: output/decision_engine_v1_events.parquet
          if-no-files-found: warn
          retention-days: 30

      - name: Upload trident probe (Stage 7.5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-v1-trident-probe-${{ steps.resolve.outputs.asof }}
          path: |
            output/trident_probe_mb_3y.parquet
            output/trident_probe_mb_3y.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload watchlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-v1-watchlist-${{ steps.resolve.outputs.asof }}
          path: |
            output/decision_engine_v1_tomorrow_watchlist_post_class_b_${{ steps.resolve.outputs.asof }}.md
            output/decision_engine_v1_tomorrow_watchlist_post_class_b_${{ steps.resolve.outputs.asof }}.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NO_DE_DAY advisory
        if: ${{ always() && (steps.stage6_verdict.outputs.data_condition == 'true' || steps.stage8_verdict.outputs.data_condition == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: de-v1-no-de-day-${{ steps.resolve.outputs.asof }}
          path: output/decision_engine_v1_no_de_day_advisory_${{ steps.resolve.outputs.asof }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Final status summary
        if: always()
        run: |
          set +e
          ASOF='${{ steps.resolve.outputs.asof }}'
          MODE='${{ steps.resolve.outputs.mode }}'
          DC6='${{ steps.stage6_verdict.outputs.data_condition }}'
          DC8='${{ steps.stage8_verdict.outputs.data_condition }}'
          STATE6='${{ steps.stage6_verdict.outputs.state }}'
          EXCLUDE='${{ steps.stage6_verdict.outputs.exclude_sources }}'
          MD_RUN='${{ steps.select_md.outputs.run_id }}'
          echo "=================================================================="
          echo "  DE v1 dispatch summary"
          echo "  mode=$MODE  asof=$ASOF"
          echo "  master-data-pull source run: $MD_RUN"
          echo "  stage6_state=$STATE6  stage6_data_condition=$DC6  stage8_data_condition=$DC8"
          if [ -n "$EXCLUDE" ]; then
            echo "  degraded: paper_origins excluded = $EXCLUDE"
          fi
          if [ "$DC6" = "true" ] || [ "$DC8" = "true" ]; then
            echo "  outcome: NO_DE_DAY (advisory artifact uploaded)"
            echo "  live gate: CLOSED"
          elif [ "$STATE6" = "PASS_DEGRADED" ]; then
            echo "  outcome: WATCHLIST_PRODUCED_DEGRADED (CSV+MD with degraded warning)"
            echo "  live gate: CLOSED"
          else
            echo "  outcome: WATCHLIST_PRODUCED (CSV+MD artifacts uploaded)"
            echo "  live gate: CLOSED"
          fi
          echo "=================================================================="
