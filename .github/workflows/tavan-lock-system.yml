name: Tavan Intraday Lock System

# PAPER-TRACK lead (single-regime 2025-26). Predicts intraday tavan lock at 11:00 so
# you enter EARLY at +3-8% (fillable, pre-queue). Outcome:
# memory/tavan_intraday_lock_system_outcome.md
# Runs ~10:55 TR (07:55 UTC) Mon-Fri — just before the 11:00 snapshot, so there's
# time to place orders. Notifies HIGH-conviction picks via Telegram. Read-only
# (no commit-back): masters are delta-pulled fresh in-runner each run.

on:
  schedule:
    - cron: '55 7 * * 1-5'        # 10:55 TR
  workflow_dispatch:
    inputs:
      asof:
        description: 'asof date YYYY-MM-DD (blank = today UTC)'
        required: false
        default: ''
      snapshot:
        description: 'snapshot'
        required: false
        default: '11:00'
        type: choice
        options: ['11:00', '13:00', '15:00']

concurrency:
  group: tavan-lock-system
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Delta-pull fresh 1h + 15m bars (in-runner, not committed)
        env:
          INTRADAY_SID: ${{ secrets.INTRADAY_SID }}
          INTRADAY_SIGN: ${{ secrets.INTRADAY_SIGN }}
          INTRADAY_HOST: ${{ secrets.INTRADAY_HOST }}
          INTRADAY_WS_URL: ${{ secrets.INTRADAY_WS_URL }}
        run: |
          set -o pipefail
          python tools/extfeed_delta_pull.py 2>&1 | tail -5 || echo "1h delta pull warn"
          python tools/extfeed_delta_pull_15m.py --days 35 2>&1 | tail -5 || echo "15m delta pull warn"

      - name: Scan + Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          ASOF="${{ github.event.inputs.asof }}"
          [ -z "$ASOF" ] && ASOF="$(date -u +%F)"
          SNAP="${{ github.event.inputs.snapshot }}"; [ -z "$SNAP" ] && SNAP="11:00"
          echo "scan asof=$ASOF snapshot=$SNAP"
          python tools/tavan_intraday_lock_system_v1.py scan --asof "$ASOF" --snapshot "$SNAP" --telegram \
            2>&1 | tee lock_scan_output.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavan-lock-scan-${{ github.run_number }}
          path: lock_scan_output.txt
          if-no-files-found: warn
          retention-days: 30
