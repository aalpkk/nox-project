name: Tavan Intraday Lock System

# PAPER-TRACK lead (single-regime 2025-26). Predicts intraday tavan lock at 11:00 so
# you enter EARLY at +3-8% (fillable, pre-queue). Outcome:
# memory/tavan_intraday_lock_system_outcome.md
#
# Runs ~11:05 TR (08:05 UTC) Mon-Fri — JUST AFTER the 11:00 bar closes (15m bars are
# close-labeled: the "11:00" snapshot needs the bar that closes at 11:00, which only
# exists after 11:00). Notifies HIGH-conviction picks via Telegram; you enter ~11:10.
#
# Masters persist across runs via actions/cache (NOT git, to avoid bloat), so the daily
# delta-pull only needs a few days. First run / cache-miss falls back to the committed
# seed master, which the --days 7 delta tops up.

on:
  # Triggered solely by cron-job.org (POST workflow_dispatch) at 11:05 TR — GitHub's
  # native schedule is removed to avoid double-runs (GH cron is also unreliable/delayed).
  workflow_dispatch:
    inputs:
      asof:
        description: 'asof date YYYY-MM-DD (blank = today UTC)'
        required: false
        default: ''
      snapshot:
        description: 'snapshot'
        required: false
        default: '11:00'
        type: choice
        options: ['11:00', '13:00', '15:00']

concurrency:
  group: tavan-lock-system
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      # Persist the intraday masters between runs so the delta stays small + current.
      # Unique key each run + restore-keys prefix => always restore the most recent.
      - name: Cache intraday masters
        uses: actions/cache@v4
        with:
          path: |
            output/extfeed_intraday_15m_master.parquet
            output/extfeed_intraday_1h_3y_master.parquet
          key: tavan-masters-${{ github.run_id }}
          restore-keys: |
            tavan-masters-

      - name: Delta-pull fresh 1h + 15m bars (cached master kept current)
        env:
          INTRADAY_SID: ${{ secrets.INTRADAY_SID }}
          INTRADAY_SIGN: ${{ secrets.INTRADAY_SIGN }}
          INTRADAY_HOST: ${{ secrets.INTRADAY_HOST }}
          INTRADAY_WS_URL: ${{ secrets.INTRADAY_WS_URL }}
        run: |
          set -o pipefail
          python tools/extfeed_delta_pull.py 2>&1 | tail -4 || echo "1h delta warn"
          python tools/extfeed_delta_pull_15m.py --days 7 2>&1 | tail -4 || echo "15m delta warn"

      - name: Scan + Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          ASOF="${{ github.event.inputs.asof }}"; [ -z "$ASOF" ] && ASOF="$(date -u +%F)"
          SNAP="${{ github.event.inputs.snapshot }}"; [ -z "$SNAP" ] && SNAP="11:00"
          echo "scan asof=$ASOF snapshot=$SNAP"
          python tools/tavan_intraday_lock_system_v1.py scan --asof "$ASOF" --snapshot "$SNAP" --telegram \
            2>&1 | tee lock_scan_output.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavan-lock-scan-${{ github.run_number }}
          path: lock_scan_output.txt
          if-no-files-found: warn
          retention-days: 30
