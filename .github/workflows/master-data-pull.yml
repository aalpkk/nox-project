name: master data pull

concurrency:
  group: master-data-pull-${{ github.ref }}-${{ github.event.inputs.mode || (github.event.schedule == '30 15 * * 1-5' && 'close' || 'intraday_1700') }}
  cancel-in-progress: false

on:
  # İki scheduled fire (mod schedule cron string'inden çözülür). TÜM veri artık
  # extfeed'den: close modu fintables API'sini ÇEKMEZ — rebuild_dataset_delta
  # --source extfeed günlük EOD'yi extfeed'den türetir; fintables master yalnızca
  # statik 10y BASE'tir (extfeed delta'sıyla uzar). Bu yüzden 19:00 "fintables
  # yayını" timing'ine gerek kalmadı → close 18:30'a alındı (extfeed'in 18:00
  # kapanış barı + kapanış-auction ~18:15'te kesinleşir; xu100 günlüğü de o an hazır).
  # Eski 17:10/17:20/17:30 + 19:00 slotları kaldırıldı (SBT/scanner/screener hepsi
  # 18:30 close'a bağlanır; 5h tarama için gün-ortası 15:00 intraday eklendi).
  #
  # intraday_1700 (extfeed only) — 15:00 TR gün-ortası (ilk 5h bar tarama hazırlığı).
  # close (extfeed + xu100 + EOD delta) — 18:30 TR günün tam kapanışı; TÜM tüketiciler
  #   (decision-engine-v1 + horizontal-base/hw-obos/mb/triangle-break scanner'ları +
  #   nox screener'ları + sbt1700-refresh) buna bağlı.
  #
  # Concurrency group modu serialize eder; delta_pull idempotent.
  schedule:
    - cron: '0 12 * * 1-5'    # 15:00 TR  intraday_1700 (gün-ortası; 5h bar tarama hazırlığı)
    - cron: '30 15 * * 1-5'   # 18:30 TR  close (extfeed+xu100+EOD delta — TÜM tüketiciler)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pull mode: intraday_1700 (extfeed only) | close (extfeed + fintables + xu100)'
        required: true
        type: choice
        options:
          - intraday_1700
          - close
      target_date:
        description: 'Operational target date (YYYY-MM-DD). Leave blank to use Europe/Istanbul today (weekend pulls back to Friday).'
        required: false
        default: ''

jobs:
  master-data-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run orchestrator
        id: run
        env:
          INTRADAY_SID: ${{ secrets.INTRADAY_SID }}
          INTRADAY_SIGN: ${{ secrets.INTRADAY_SIGN }}
          INTRADAY_HOST: ${{ secrets.INTRADAY_HOST }}
          INTRADAY_WS_URL: ${{ secrets.INTRADAY_WS_URL }}
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          # workflow_dispatch sets MODE; cron fires leave it empty. On cron,
          # resolve from the schedule string: '30 15 * * 1-5' (18:30 TR) → close,
          # '0 12 * * 1-5' (15:00 TR) → intraday_1700.
          if [ -z "$MODE" ]; then
            case '${{ github.event.schedule }}' in
              '30 15 * * 1-5')
                MODE=close
                ;;
              *)
                MODE=intraday_1700
                ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          TARGET='${{ github.event.inputs.target_date }}'
          if [ -n "$TARGET" ]; then
            python tools/master_data_pull_orchestrator.py --mode "$MODE" --target-date "$TARGET"
          else
            python tools/master_data_pull_orchestrator.py --mode "$MODE"
          fi

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-data-manifest
          path: output/master_data_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload extfeed master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-extfeed-intraday-1h
          path: output/extfeed_intraday_1h_3y_master.parquet
          if-no-files-found: error
          retention-days: 30

      - name: Upload fintables master
        if: ${{ always() && steps.run.outputs.mode == 'close' }}
        uses: actions/upload-artifact@v4
        with:
          name: master-ohlcv-fintables
          path: output/ohlcv_10y_fintables_master.parquet
          if-no-files-found: warn
          retention-days: 30

      - name: Upload xu100 daily
        if: ${{ always() && steps.run.outputs.mode == 'close' }}
        uses: actions/upload-artifact@v4
        with:
          name: master-xu100-extfeed-daily
          path: output/xu100_extfeed_daily.parquet
          if-no-files-found: error
          retention-days: 30
