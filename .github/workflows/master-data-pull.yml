name: master data pull

concurrency:
  group: master-data-pull-${{ github.ref }}-${{ github.event.inputs.mode || (github.event.schedule == '0 16 * * 1-5' && 'close' || 'intraday_1700') }}
  cancel-in-progress: false

on:
  # İki tür scheduled fire (mod schedule cron string'inden çözülür):
  #
  # intraday_1700 (extfeed only) — 17:10/17:20/17:30 + 18:30 TR slotları.
  #   17:10-17:30: SBT-1700 tüketicisi için (16:00–17:00 barı 17:00 TR'de
  #   kapanır, extfeed 14:00 UTC barını yayınlar). 18:30: BIST 18:00
  #   kapanışından SONRA günün SON 1h barını (18:00 kapanış) yakalar →
  #   günlük BIST taramaları (regime/divergence/weekly/smart-breakout)
  #   post-kapanış çalıştırmalarında bunun tam-gün extfeed'ini tüketir.
  #   fintables/xu100 token bağımlılığı YOK.
  #
  # close (extfeed + fintables + xu100) — 19:00 TR tek slot. BIST 18:00
  #   kapanışından sonra fintables + xu100 günlük kapanışları yayınlanınca
  #   çekilir. decision-engine-v1 + mb-scanner/hw-obos/horizontal-base/
  #   triangle-break/sbt1700-refresh (mode==close tüketicileri) buna bağlı.
  #
  # Concurrency group modu serialize eder; delta_pull idempotent.
  schedule:
    - cron: '10 14 * * 1-5'   # 17:10 TR  intraday_1700
    - cron: '20 14 * * 1-5'   # 17:20 TR  intraday_1700
    - cron: '30 14 * * 1-5'   # 17:30 TR  intraday_1700
    - cron: '30 15 * * 1-5'   # 18:30 TR  intraday_1700 (günün tam kapanışı; günlük taramalar)
    - cron: '0 16 * * 1-5'    # 19:00 TR  close (fintables+xu100; DE v1 + close tüketicileri)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pull mode: intraday_1700 (extfeed only) | close (extfeed + fintables + xu100)'
        required: true
        type: choice
        options:
          - intraday_1700
          - close
      target_date:
        description: 'Operational target date (YYYY-MM-DD). Leave blank to use Europe/Istanbul today (weekend pulls back to Friday).'
        required: false
        default: ''

jobs:
  master-data-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run orchestrator
        id: run
        env:
          INTRADAY_SID: ${{ secrets.INTRADAY_SID }}
          INTRADAY_SIGN: ${{ secrets.INTRADAY_SIGN }}
          INTRADAY_HOST: ${{ secrets.INTRADAY_HOST }}
          INTRADAY_WS_URL: ${{ secrets.INTRADAY_WS_URL }}
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          # workflow_dispatch sets MODE; cron fires leave it empty. On cron,
          # resolve from the schedule string: '0 16 * * 1-5' (19:00 TR) → close,
          # all others (14:xx + 15:30) → intraday_1700.
          if [ -z "$MODE" ]; then
            case '${{ github.event.schedule }}' in
              '0 16 * * 1-5')
                MODE=close
                ;;
              *)
                MODE=intraday_1700
                ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          TARGET='${{ github.event.inputs.target_date }}'
          if [ -n "$TARGET" ]; then
            python tools/master_data_pull_orchestrator.py --mode "$MODE" --target-date "$TARGET"
          else
            python tools/master_data_pull_orchestrator.py --mode "$MODE"
          fi

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-data-manifest
          path: output/master_data_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload extfeed master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-extfeed-intraday-1h
          path: output/extfeed_intraday_1h_3y_master.parquet
          if-no-files-found: error
          retention-days: 30

      - name: Upload fintables master
        if: ${{ always() && steps.run.outputs.mode == 'close' }}
        uses: actions/upload-artifact@v4
        with:
          name: master-ohlcv-fintables
          path: output/ohlcv_10y_fintables_master.parquet
          if-no-files-found: warn
          retention-days: 30

      - name: Upload xu100 daily
        if: ${{ always() && steps.run.outputs.mode == 'close' }}
        uses: actions/upload-artifact@v4
        with:
          name: master-xu100-extfeed-daily
          path: output/xu100_extfeed_daily.parquet
          if-no-files-found: error
          retention-days: 30
