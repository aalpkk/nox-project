name: NOX Regime Transition Screener
on:
  workflow_run:
    workflows: ["master data pull"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read  # gate downloads the upstream master-data-pull manifest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Gate — close-mode master-data-pull PASS only
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "[gate] manual workflow_dispatch — proceed"
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$UPSTREAM_BRANCH" != "main" ] || [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "[gate] SKIP: branch=$UPSTREAM_BRANCH conclusion=$UPSTREAM_CONCLUSION"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tmp=$(mktemp -d)
          if ! gh run download "$UPSTREAM_ID" -n master-data-manifest -D "$tmp" >/dev/null 2>&1; then
            echo "[gate] SKIP: upstream $UPSTREAM_ID has no master-data-manifest"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ok=$(python -c "import json;m=json.load(open('$tmp/master_data_manifest.json'));print('yes' if m.get('mode')=='close' and m.get('verdict')=='PASS' and m.get('freshness_status')=='PASS' else 'no')")
          if [ "$ok" = "yes" ]; then
            echo "[gate] PROCEED: upstream $UPSTREAM_ID close-mode PASS"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "[gate] SKIP: upstream $UPSTREAM_ID not close-mode-PASS"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  regime-daily:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore extfeed master (single data source)
        uses: ./.github/actions/restore-extfeed-master
        with:
          github-token: ${{ github.token }}
      - run: python run_regime_transition.py --csv --html --notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_PAGES_REPO: ${{ secrets.GH_PAGES_REPO }}
      - uses: actions/upload-artifact@v4
        with:
          name: regime-daily-${{ github.run_number }}
          path: |
            output/regime_transition_*.csv
            output/regime_transition_*.html

  regime-weekly:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore extfeed master (single data source)
        uses: ./.github/actions/restore-extfeed-master
        with:
          github-token: ${{ github.token }}
      - name: Check if Friday
        id: check_day
        run: |
          if [ "$(date -u +%u)" == "5" ]; then
            echo "is_friday=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check_day.outputs.is_friday == 'true' || github.event_name == 'workflow_dispatch'
        run: python run_regime_transition.py --tf weekly --csv --html --notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_PAGES_REPO: ${{ secrets.GH_PAGES_REPO }}
      - uses: actions/upload-artifact@v4
        if: steps.check_day.outputs.is_friday == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: regime-weekly-${{ github.run_number }}
          path: |
            output/regime_transition_weekly_*.csv
            output/regime_transition_weekly_*.html

  regime-monthly:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore extfeed master (single data source)
        uses: ./.github/actions/restore-extfeed-master
        with:
          github-token: ${{ github.token }}
      - name: Check last Friday of month
        id: check_month
        run: |
          DOW=$(date -u +%u)
          THIS_MONTH=$(date -u +%m)
          NEXT_FRI_MONTH=$(date -u -d "next friday" +%m)
          if [ "$DOW" == "5" ] && [ "$NEXT_FRI_MONTH" != "$THIS_MONTH" ]; then
            echo "is_last_friday=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check_month.outputs.is_last_friday == 'true' || github.event_name == 'workflow_dispatch'
        run: python run_regime_transition.py --tf monthly --csv --html --notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_PAGES_REPO: ${{ secrets.GH_PAGES_REPO }}
      - uses: actions/upload-artifact@v4
        if: steps.check_month.outputs.is_last_friday == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: regime-monthly-${{ github.run_number }}
          path: |
            output/regime_transition_monthly_*.csv
            output/regime_transition_monthly_*.html
