name: Sector Rotation Monitor (PAPER)

# XU100 dip-dönüş durum makinesi + rotasyon takvimi PAPER takibi.
# Backtest karnesi era-fragile FAIL → canlı para sistemi DEĞİL; taze-veri
# doğrulama + karar desteği. Spec: docs/sector_rotation_trade_spec_v0.md
# (fren kuralları dahil, kilitli). Veri: extfeed_index_1h_master (TradingView,
# nyx_rotation ile TEK-KAYNAK; İŞY 1-seans gecikmesi BIRAKILDI → güncel seansa ulaşır).
#
# Takvim: hafta içi 20:30 TR (17:30 UTC) — BIST kapanış 18:00 TR sonrası;
# extfeed_index_pull --delta o günün kapanışını çeker.

on:
  schedule:
    # Pzt-Cuma 20:30 TR (UTC+3) = 17:30 UTC
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
    inputs:
      digest:
        description: 'Yeni olay olmasa da tam durumu Telegram''a yolla'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: sector-rotation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh index master (TradingView delta — güncel seans)
        # İŞY (1 seans gecikmeli) BIRAKILDI; extfeed_index_1h_master nyx_rotation ile
        # tek-kaynak. Delta-pull başarısızsa git'teki master kullanılır (graceful).
        run: python tools/extfeed_index_pull.py --delta-days 10 || echo "::warning::index delta-pull başarısız — git'teki master kullanılacak"

      - name: Run monitor
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ARGS="--log --notify"
          if [ "${{ github.event.inputs.digest }}" = "true" ]; then
            ARGS="$ARGS --digest"
          fi
          python tools/sector_rotation_monitor_v0.py $ARGS 2>&1 | tee sector_rotation_output.txt

      - name: Commit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/sector_rotation_monitor_log.csv output/extfeed_index_1h_master.parquet || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "chore(sector-rotation): paper log $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rotation-monitor-${{ github.run_number }}
          path: |
            output/sector_rotation_monitor_log.csv
            sector_rotation_output.txt
          if-no-files-found: warn
          retention-days: 30
