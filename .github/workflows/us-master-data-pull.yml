name: us master data pull

# POC workflow for the NASDAQ port of mb_scanner. Mirrors the BIST
# master-data-pull workflow but targets the US 1h master parquet
# (output/extfeed_intraday_1h_3y_master_us.parquet) and runs an optional
# mb_scanner smoke scan on top.
#
# Manual-dispatch only — no schedule yet. Once the POC validates, we can
# add a cron similar to master-data-pull.yml (US market close ≈ 21:00 UTC).
#
# Outputs are uploaded as artifacts. Nothing is committed back to the repo
# at this stage; the user inspects artifacts and decides whether to promote
# the master parquet into version control.

concurrency:
  group: us-master-data-pull-${{ github.ref }}-${{ github.event.inputs.mode || 'bootstrap' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pull mode'
        required: true
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - delta
      universe:
        description: 'Universe: NDX100 | POC (5 tickers) | space-separated tickers (e.g. "AAPL MSFT NVDA")'
        required: true
        default: 'POC'
        type: string
      run_scan:
        description: 'Run mb_scanner smoke scan after pull'
        required: true
        type: boolean
        default: true

jobs:
  us-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve universe
        id: resolve
        run: |
          set -euo pipefail
          UNIV='${{ github.event.inputs.universe }}'
          case "$UNIV" in
            NDX100)
              echo "args=" >> "$GITHUB_OUTPUT"
              echo "label=NDX100" >> "$GITHUB_OUTPUT"
              ;;
            POC)
              echo "args=--universe AAPL MSFT NVDA GOOGL AMZN" >> "$GITHUB_OUTPUT"
              echo "label=POC-5" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "args=--universe $UNIV" >> "$GITHUB_OUTPUT"
              echo "label=custom" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run US pull
        env:
          INTRADAY_SID: ${{ secrets.INTRADAY_SID }}
          INTRADAY_SIGN: ${{ secrets.INTRADAY_SIGN }}
          INTRADAY_HOST: ${{ secrets.INTRADAY_HOST }}
          INTRADAY_WS_URL: ${{ secrets.INTRADAY_WS_URL }}
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          ARGS='${{ steps.resolve.outputs.args }}'
          echo "[run] mode=$MODE args=$ARGS"
          python tools/extfeed_pull_us.py --mode "$MODE" $ARGS

      - name: Upload US master parquet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extfeed-us-master-${{ steps.resolve.outputs.label }}-${{ github.event.inputs.mode }}
          path: output/extfeed_intraday_1h_3y_master_us.parquet
          if-no-files-found: error
          retention-days: 14

      - name: Run mb_scanner smoke scan
        if: ${{ github.event.inputs.run_scan == 'true' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.universe }}" = "POC" ]; then
            python tools/mb_scanner_us_poc.py --tickers AAPL MSFT NVDA GOOGL AMZN
          else
            python tools/mb_scanner_us_poc.py
          fi

      - name: Upload mb_scanner outputs
        if: ${{ github.event.inputs.run_scan == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mb-scanner-us-${{ steps.resolve.outputs.label }}
          path: output/mb_scanner_us_*.parquet
          if-no-files-found: warn
          retention-days: 14
