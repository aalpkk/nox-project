name: Nyx Rotation Telegram (PAPER)

# Günlük 4-bilgilik rotasyon raporu → Telegram:
#  ① LİDER sektörler ② sonraki-lider adayı (ARMED+anatomi) ③ yeni dönen (ARMED)
#  ④ down-capture AL adayları (defansif, hedef sektörlerde).
# Betimsel + paper; canlı para sistemi DEĞİL.
# TEK-KAYNAK (TradingView/extfeed):
#   - ④ hisseler: extfeed_intraday_1h_3y_master (restore-extfeed-master ile günlük taze)
#   - ①②③ endeksler: extfeed_index_1h_master (extfeed_index_pull.py --delta ile tazelenir)
# İŞ Yatırım + Fintables karışımı BIRAKILDI (iki-kaynak hizalaması nan/gecikme üretiyordu).

on:
  schedule:
    - cron: '30 17 * * 1-5'      # hafta içi 20:30 TR
  workflow_dispatch:

permissions:
  contents: write      # endeks master delta'sını commit eder
  actions: read        # restore-extfeed-master: master-data-pull artifact'ını indirir

concurrency:
  group: nyx-rotation-telegram
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Restore extfeed master (hisseler — single source)
        uses: ./.github/actions/restore-extfeed-master
        with:
          github-token: ${{ github.token }}
      - name: Refresh index master (endeksler — TradingView delta)
        env:
          INTRADAY_SID: ${{ secrets.INTRADAY_SID }}
          INTRADAY_SIGN: ${{ secrets.INTRADAY_SIGN }}
          INTRADAY_HOST: ${{ secrets.INTRADAY_HOST }}
          INTRADAY_WS_URL: ${{ secrets.INTRADAY_WS_URL }}
        run: python tools/extfeed_index_pull.py --delta-days 10 || echo "::warning::index delta-pull başarısız — git'teki master kullanılacak"
      - name: Build + send report
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python tools/nyx_rotation_telegram_v0.py --notify 2>&1 | tee nyx_rotation_output.txt
      - name: Commit refreshed index master
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/extfeed_index_1h_master.parquet || true
          if git diff --cached --quiet; then
            echo "Endeks master değişmedi — commit atlanıyor."
          else
            git commit -m "chore(nyx-rotation): endeks master delta $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-rotation-${{ github.run_number }}
          path: nyx_rotation_output.txt
          if-no-files-found: warn
          retention-days: 14
